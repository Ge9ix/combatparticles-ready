name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - name: Build
        run: |
          FILE=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "settings.gradle not found anywhere in the repo - the project files were not uploaded"
            ls -R | head -50
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Building in $DIR"
          cd "$DIR"
          gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: combatparticles-jar
          path: |
            **/build/libs/combatparticles-*.jar
            !**/build/libs/*-sources.jar
